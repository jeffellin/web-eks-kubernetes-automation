spring.application.name=demo

# H2 Database configuration (default for non-production)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# JPA configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Actuator configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Guestbook UI configuration
guestbook.theme=dark

server.forward-headers-strategy=NATIVE
server.use-forward-headers=true
server.tomcat.redirect-context-root=false
server.tomcat.use-relative-redirects=true

# Add these Vaadin-specific properties
vaadin.urlMapping=/*
vaadin.whitelisted-packages=com.vaadin,org.vaadin,com.example

# Important for proxy
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# Spring Security OAuth2 Resource Server - JWT validation
# Note: We only specify jwk-set-uri, not issuer-uri, to avoid auto-discovery
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://ellinj.teleport.sh/.well-known/jwks.json

# Custom header for Teleport JWT
teleport.jwt.header-name=Teleport-Jwt-Assertion

# Logging for debugging
logging.level.org.springframework.security=DEBUG