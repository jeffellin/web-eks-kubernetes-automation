name: Maven Package

on:
  push:
    paths-ignore:
      - 'd/**'
  pull_request:
    branches: [ main, dev, prod ]
permissions:
  security-events: write
  contents: write

jobs:
  package:
    runs-on: self-hosted
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: test/unit-tests
      run: ./mvnw test

    - name: package
      run: ./mvnw package
    
    - name: Upload target artifacts
      uses: actions/upload-artifact@v4
      with:
        name: maven-artifacts
        path: target/

  docker-build:
    name: docker/build
    runs-on: self-hosted
    needs: package
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download target artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-artifacts
          path: target/
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: build/docker
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          ECR_REPOSITORY="demo-app"
          IMAGE_TAG="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          
          # Build image using Dockerfile
          docker build -t "$IMAGE_TAG" .
          
          # Tag as latest
          docker tag "$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          
          # Push both tags
          docker push "$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  trivy:
    name: security/scan
    runs-on: self-hosted
    needs: docker-build
    if: github.event_name == 'pull_request' || contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/prod"]'), github.ref)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/demo-app:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Check Code Scanning alerts
        if: github.event_name == 'pull_request'
        run: |
          # Wait for SARIF to be processed
          sleep 30
          
          # Get code scanning alerts using REST API
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/code-scanning/alerts?state=open")
          
          # Count critical and high severity alerts
          ALERTS=$(echo "$RESPONSE" | jq '[.[] | select(.rule.security_severity_level == "critical" or .rule.security_severity_level == "high")] | length')
          
          echo "Found $ALERTS critical/high severity alerts"
          
          if [ "$ALERTS" -gt "0" ]; then
            echo "❌ Build failed due to $ALERTS critical/high security vulnerabilities"
            echo "Review alerts in the Security tab and dismiss false positives if needed"
            exit 1
          else
            echo "✅ No blocking security vulnerabilities found"
          fi

  deploy:
    name: Update Kubernetes Deployment
    runs-on: self-hosted
    needs: [docker-build, trivy]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Generate GitHub App token
        id: generate_token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.PRIVATE_KEY }}
      
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: 'jeffellin/eks-kubernetes-gitops'
          token: ${{ steps.generate_token.outputs.token }}
          path: gitops-repo
      
      - name: Create new branch
        run: |
          cd gitops-repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          BRANCH_NAME="update-deployment-${{ github.sha }}"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Update deployment image tag
        run: |
          cd gitops-repo
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          ECR_REPOSITORY="demo-app"
          NEW_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          sed -i "s|image: .*|image: $NEW_IMAGE|g" demo-app/deployment.yaml
          
      - name: Commit and push changes
        run: |
          cd gitops-repo
          git add demo-app/
          git commit -m "Update deployment image to SHA ${{ github.sha }}" || exit 0
          git pull origin "$BRANCH_NAME" || true
          git push origin "$BRANCH_NAME"
      
      - name: Create Pull Request
        run: |
          cd gitops-repo
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          ECR_REPOSITORY="demo-app"
          gh pr create \
            --title "Update deployment image to ${{ github.sha }}" \
            --body "Automated deployment update from web-eks-kubernetes-automation
            
            - Updated image tag to: $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
            - Source commit: ${{ github.repository }}@${{ github.sha }}" \
            --base main \
            --head "$BRANCH_NAME"
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}

