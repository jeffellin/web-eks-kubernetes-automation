name: Maven Package

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'k8s/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'k8s/**'

permissions:
  security-events: write
  contents: write

jobs:
  package:
    runs-on: self-hosted
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Run Maven package
      run: ./mvnw package

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ellinj
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Install pack CLI
      run: |
        curl -sSL "https://github.com/buildpacks/pack/releases/download/v0.32.1/pack-v0.32.1-linux.tgz" | sudo tar -C /usr/local/bin/ --no-same-owner -xzv pack
        pack --version
    
    - name: Build and push Docker image with pack CLI
      run: |
        IMAGE_TAG="ellinj/demo-sec-app:${{ github.sha }}"
        
        # Build and push SHA-tagged image
        pack build $IMAGE_TAG \
          --path target/ \
          --builder paketobuildpacks/builder-jammy-base \
          --env BP_JVM_VERSION=17 \
          --publish 
        docker iamges 
        echo "step 2"
        # Also tag as latest
        docker tag "$IMAGE_TAG" ellinj/demo-sec-app:latest
        echo "step 2"
        docker push ellinj/demo-sec-app:latest
  trivy:
    name: Security Scan
    runs-on: self-hosted
    needs: package
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: 'ellinj/demo-sec-app:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    name: Update Kubernetes Deployment
    runs-on: self-hosted
    needs: [package, trivy]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update deployment image tag
        run: |
          sed -i "s|image: demo-app:.*|image: docker.io/ellinj/demo-sec-app:${{ github.sha }}|g" k8s/deployment.yaml
          
      - name: Commit updated deployment
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add k8s/deployment.yaml
          git commit -m "Update deployment image to SHA ${{ github.sha }}" || exit 0
          git push
