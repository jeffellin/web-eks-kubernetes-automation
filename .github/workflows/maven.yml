name: Maven Package

on:
  push:
    paths-ignore:
      - 'k8s/**'
  pull_request:
    branches: [ main, dev, prod ]
    paths-ignore:
      - 'k8s/**'

permissions:
  security-events: write
  contents: write

jobs:
  package:
    runs-on: self-hosted
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: test/unit-tests
      run: ./mvnw test

    - name: package
      run: ./mvnw package
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ellinj
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Install pack CLI
      run: |
        curl -sSL "https://github.com/buildpacks/pack/releases/download/v0.32.1/pack-v0.32.1-linux.tgz" | sudo tar -C /usr/local/bin/ --no-same-owner -xzv pack
        pack --version
    
    - name: build/docker
      run: |
        IMAGE_TAG="ellinj/demo-sec-app:${{ github.sha }}"
        
        # Build image locally first
        pack build $IMAGE_TAG \
          --path target/ \
          --builder paketobuildpacks/builder-jammy-base \
          --env BP_JVM_VERSION=17
        
        # Tag as latest
        docker tag "$IMAGE_TAG" ellinj/demo-sec-app:latest
        
        # Push both tags
        docker push "$IMAGE_TAG"
        docker push ellinj/demo-sec-app:latest
  trivy:
    name: security/scan
    runs-on: self-hosted
    needs: package
    if: github.event_name == 'pull_request' || contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/prod"]'), github.ref)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'ellinj/demo-sec-app:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Check Code Scanning alerts
        if: github.event_name == 'pull_request'
        run: |
          # Wait for SARIF to be processed
          sleep 30
          
          # Get code scanning alerts using REST API
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/code-scanning/alerts?state=open")
          
          # Count critical and high severity alerts
          ALERTS=$(echo "$RESPONSE" | jq '[.[] | select(.rule.security_severity_level == "critical" or .rule.security_severity_level == "high")] | length')
          
          echo "Found $ALERTS critical/high severity alerts"
          
          if [ "$ALERTS" -gt "0" ]; then
            echo "❌ Build failed due to $ALERTS critical/high security vulnerabilities"
            echo "Review alerts in the Security tab and dismiss false positives if needed"
            exit 1
          else
            echo "✅ No blocking security vulnerabilities found"
          fi

  deploy:
    name: Update Kubernetes Deployment
    runs-on: self-hosted
    needs: [package, trivy]
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update deployment image tag
        run: |
          sed -i "s|image: .*ellinj/demo-sec-app:.*|image: ellinj/demo-sec-app:${{ github.sha }}|g" k8s/deployment.yaml
          
      - name: Commit updated deployment
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add k8s/deployment.yaml
          git commit -m "Update deployment image to SHA ${{ github.sha }}" || exit 0
          git push

  code-review:
    name: Code Review
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/code-review.yml
    with:
      custom_prompt: |
        Review this Java Spring Boot application file focusing on:
        
        **Spring Boot Best Practices:**
        - Proper use of annotations (@Service, @Repository, @Controller)
        - Configuration management
        - Bean lifecycle and dependency injection
        
        **Java & Maven Specific:**
        - Code structure and organization
        - Exception handling patterns
        - Testing approach (unit vs integration)
        
        **Security & Performance:**
        - Spring Security implementation
        - Database connection handling
        - Memory and resource management
        
        **File:** {{FILE_PATH}}
        
        **Content:**
        ```{{FILE_EXTENSION}}
        {{FILE_CONTENT}}
        ```
        
        Provide actionable feedback for this Spring Boot application.
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      checks: write