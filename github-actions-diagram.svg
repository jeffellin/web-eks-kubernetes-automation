<svg width="1000" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">GitHub Actions Workflow Architecture</text>
  
  <!-- Triggers Section -->
  <rect x="50" y="60" width="200" height="120" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="10"/>
  <text x="150" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Triggers</text>
  <text x="60" y="110" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Push (non-k8s files)</text>
  <text x="60" y="130" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Pull Request</text>
  <text x="60" y="150" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Branches: main, dev, prod</text>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Ignores: k8s/**</text>
  
  <!-- Maven Workflow Main -->
  <rect x="350" y="60" width="600" height="610" fill="#fff" stroke="#34495e" stroke-width="3" rx="15"/>
  <text x="650" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Maven Package Workflow</text>
  <text x="365" y="110" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Self-hosted runner</text>
  
  <!-- Package Job -->
  <rect x="370" y="130" width="260" height="180" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="500" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Package Job</text>
  <text x="380" y="175" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">1. Checkout code</text>
  <text x="380" y="190" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">2. Setup JDK 17</text>
  <text x="380" y="205" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">3. Cache Maven deps</text>
  <text x="380" y="220" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">4. Run tests (./mvnw test)</text>
  <text x="380" y="235" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">5. Package (./mvnw package)</text>
  <text x="380" y="250" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">6. Docker login</text>
  <text x="380" y="265" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">7. Install pack CLI</text>
  <text x="380" y="280" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">8. Build &amp; push Docker image</text>
  <text x="380" y="295" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">   (ellinj/demo-sec-app)</text>
  
  <!-- Trivy Job -->
  <rect x="370" y="330" width="260" height="150" fill="#fdf2e8" stroke="#f39c12" stroke-width="2" rx="8"/>
  <text x="500" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Security Scan (Trivy)</text>
  <text x="380" y="375" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Depends on: Package</text>
  <text x="380" y="395" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">1. Checkout code</text>
  <text x="380" y="410" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">2. Scan Docker image</text>
  <text x="380" y="425" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">3. Upload SARIF to GitHub</text>
  <text x="380" y="440" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">4. Check for critical/high alerts</text>
  <text x="380" y="455" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">5. Fail if vulnerabilities found</text>
  <text x="380" y="470" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">   (Only on PRs)</text>
  
  <!-- Deploy Job -->
  <rect x="370" y="500" width="260" height="120" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="8"/>
  <text x="500" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Deploy (dev branch only)</text>
  <text x="380" y="545" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Depends on: Package + Trivy</text>
  <text x="380" y="565" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">1. Checkout code</text>
  <text x="380" y="580" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">2. Update k8s/deployment.yaml</text>
  <text x="380" y="595" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">3. Commit &amp; push changes</text>
  <text x="380" y="610" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">   (new image SHA)</text>
  
  <!-- Code Review Job -->
  <rect x="670" y="130" width="260" height="150" fill="#f8e8ff" stroke="#9b59b6" stroke-width="2" rx="8"/>
  <text x="800" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Code Review (Claude)</text>
  <text x="800" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">(Pull Requests Only)</text>
  <text x="680" y="185" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Calls: code-review.yml</text>
  <text x="680" y="200" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Custom Spring Boot prompt</text>
  <text x="680" y="215" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Scans all src/ files</text>
  <text x="680" y="230" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Reviews Java, XML, properties</text>
  <text x="680" y="245" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Posts PR comments</text>
  <text x="680" y="260" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Uses Claude Sonnet 4</text>
  
  <!-- Code Review Workflow Detail -->
  <rect x="670" y="300" width="260" height="170" fill="#f0f0f0" stroke="#7f8c8d" stroke-width="2" rx="8"/>
  <text x="800" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">code-review.yml Details</text>
  <text x="680" y="345" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Trigger: workflow_call</text>
  <text x="680" y="365" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">1. Checkout PR branch</text>
  <text x="680" y="380" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">2. Find src/ files</text>
  <text x="680" y="395" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">3. Setup Node.js 20</text>
  <text x="680" y="410" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">4. Install Anthropic SDK</text>
  <text x="680" y="425" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">5. Run Claude analysis</text>
  <text x="680" y="440" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">6. Post GitHub comment</text>
  <text x="680" y="455" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">Runs on: ubuntu-latest</text>
  
  <!-- Secrets &amp; Permissions -->
  <rect x="670" y="490" width="260" height="100" fill="#ffe8e8" stroke="#e74c3c" stroke-width="2" rx="8"/>
  <text x="800" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Required Secrets</text>
  <text x="680" y="535" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• ANTHROPIC_API_KEY</text>
  <text x="680" y="550" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• DOCKER_PASSWORD</text>
  <text x="680" y="565" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• GITHUB_TOKEN (auto)</text>
  <text x="680" y="580" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Permissions: PR write, contents read</text>
  
  <!-- Docker Hub -->
  <rect x="50" y="350" width="150" height="80" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="8"/>
  <text x="125" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Docker Hub</text>
  <text x="60" y="395" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">ellinj/demo-sec-app</text>
  <text x="60" y="410" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">:latest &amp; :SHA tags</text>
  
  <!-- GitHub Security -->
  <rect x="50" y="450" width="150" height="80" fill="#fdf2e8" stroke="#f39c12" stroke-width="2" rx="8"/>
  <text x="125" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">GitHub Security</text>
  <text x="60" y="495" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">SARIF uploads</text>
  <text x="60" y="510" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Code scanning alerts</text>
  
  <!-- Kubernetes -->
  <rect x="50" y="550" width="150" height="80" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="125" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Kubernetes</text>
  <text x="60" y="595" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Auto deployment</text>
  <text x="60" y="610" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">(dev branch only)</text>
  
  <!-- Arrows -->
  <!-- Removed for manual editing -->
  
  <!-- Legend -->
  <rect x="50" y="680" width="900" height="100" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="500" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Workflow Features</text>
  <text x="70" y="730" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Parallel execution of Package and Code Review jobs</text>
  <text x="70" y="745" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Security scanning with Trivy (fails PR if critical/high vulnerabilities)</text>
  <text x="70" y="760" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Automated deployment to Kubernetes on dev branch commits</text>
  <text x="500" y="730" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Custom Claude code review with Spring Boot expertise</text>
  <text x="500" y="745" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Self-hosted runners for Maven builds, Ubuntu for code review</text>
  <text x="500" y="760" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Docker image building with Cloud Native Buildpacks</text>
</svg>